<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04080f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffb84d'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%231a0d00'%3E$%3C/text%3E%3C/svg%3E">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px}[hidden]{display:none!important}</style><title>Câmbio Ao Vivo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: tela de TV 16:9 — faixa superior com relógios do mundo, palco grande com preço gigante e gráfico luminoso, coluna de moedas com minigráficos, letreiro no rodapé */
:root {
  --bg: #04080f;
  --surface: rgba(16, 28, 48, .55);
  --edge: rgba(120, 160, 220, .14);
  --fg: #eef3fb;
  --muted: #7d8fab;
  --brand: #ffb84d;
  --up: #2ee59d;
  --down: #ff4d6d;
  --warn: #ffb84d;
  --sim: #a78bfa;
  --trend: var(--up);
  --display: "Space Grotesk", "Segoe UI", sans-serif;
  --body: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); display: flex; flex-direction: column; overflow-x: hidden; position: relative; }
body.trend-down { --trend: var(--down); }
.gut { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* Fundo vivo: brilho que muda de cor com a tendência + grade de pregão */
.aura { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(60% 55% at 30% 60%, color-mix(in srgb, var(--trend) 16%, transparent), transparent 70%),
    radial-gradient(40% 40% at 85% 10%, color-mix(in srgb, var(--brand) 8%, transparent), transparent 70%);
  transition: background 1.2s; animation: breathe 8s ease-in-out infinite; }
.grid { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background-image: linear-gradient(var(--edge) 1px, transparent 1px), linear-gradient(90deg, var(--edge) 1px, transparent 1px);
  background-size: 64px 64px; mask-image: radial-gradient(ellipse at 40% 50%, #000 20%, transparent 75%); }
@keyframes breathe { 50% { opacity: .65; } }
header, nav, main, .ticker { position: relative; z-index: 1; }

.top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding-block: 14px; border-bottom: 1px solid var(--edge); }
.logo { font-family: var(--display); font-weight: 700; font-size: 1.5rem; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.logo .mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--brand), #ff7a45); display: grid; place-items: center; color: #1a0d00; font-size: 1rem; }
.logo span { color: var(--brand); }
.status { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: .85rem; letter-spacing: .14em;
  padding: 5px 12px; border-radius: 999px; background: color-mix(in srgb, var(--down) 18%, transparent); color: var(--down); border: 1px solid color-mix(in srgb, var(--down) 45%, transparent); }
.status i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; animation: blink 1.2s infinite; }
.status.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.status.sim { color: var(--sim); background: color-mix(in srgb, var(--sim) 15%, transparent); border-color: color-mix(in srgb, var(--sim) 45%, transparent); }
@keyframes blink { 50% { opacity: .25; } }
.world { display: flex; gap: 20px; margin-left: auto; flex-wrap: wrap; }
.city { display: flex; flex-direction: column; gap: 1px; }
.city span { font-size: .66rem; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
.city b { font-family: var(--mono); font-weight: 500; font-size: 1rem; font-variant-numeric: tabular-nums; }
.city.home b { color: var(--brand); font-size: 1.15rem; }
.tools { display: flex; gap: 8px; }
button { font: inherit; cursor: pointer; }
.tbtn { background: var(--surface); color: var(--fg); border: 1px solid var(--edge); border-radius: 8px; padding: 6px 12px; font-size: .82rem; backdrop-filter: blur(8px); }
.tbtn:hover { border-color: var(--muted); }
.tbtn[aria-pressed="true"] { background: var(--brand); color: #1a0d00; border-color: var(--brand); font-weight: 600; }
button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; padding-block: 18px; min-height: 0; }
.stage { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 420px; position: relative; }
.sym { position: absolute; right: 2%; top: 4%; font-family: var(--display); font-weight: 700; font-size: clamp(8rem, 22vw, 20rem); line-height: 1;
  color: var(--trend); opacity: .05; pointer-events: none; transition: color 1.2s; }
.eyebrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pair { font-family: var(--mono); font-size: .9rem; color: var(--brand); padding: 3px 10px; border: 1px solid color-mix(in srgb, var(--brand) 40%, transparent); border-radius: 6px; }
.name { font-family: var(--display); font-size: clamp(1.2rem, 2.2vw, 1.8rem); font-weight: 600; letter-spacing: -.01em; }
.hero { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; }
.price { font-family: var(--mono); font-weight: 700; font-size: clamp(2.8rem, 8vw, 6.4rem); line-height: .95; letter-spacing: -.04em; font-variant-numeric: tabular-nums;
  text-shadow: 0 0 40px color-mix(in srgb, var(--trend) 35%, transparent); white-space: nowrap; }
.price .cur { font-size: .42em; color: var(--muted); letter-spacing: 0; margin-right: .2em; vertical-align: .9em; }
.price .d { display: inline-block; }
.price .d.roll-up { animation: rollUp .6s cubic-bezier(.2, .8, .2, 1); }
.price .d.roll-down { animation: rollDown .6s cubic-bezier(.2, .8, .2, 1); }
@keyframes rollUp { from { transform: translateY(45%); opacity: 0; color: var(--up); } 60% { color: var(--up); } }
@keyframes rollDown { from { transform: translateY(-45%); opacity: 0; color: var(--down); } 60% { color: var(--down); } }
.chg { display: flex; flex-direction: column; gap: 4px; padding-bottom: 6px; }
.pill { font-family: var(--mono); font-weight: 700; font-size: clamp(1rem, 1.8vw, 1.4rem); padding: 4px 12px; border-radius: 8px; color: var(--trend);
  background: color-mix(in srgb, var(--trend) 14%, transparent); border: 1px solid color-mix(in srgb, var(--trend) 35%, transparent); font-variant-numeric: tabular-nums; }
.chg small { font-size: .75rem; color: var(--muted); }
.range { display: flex; gap: 6px; margin-left: auto; align-self: flex-end; padding-bottom: 6px; }

.chartwrap { position: relative; flex: 1; min-height: 260px; border-radius: 14px; background: linear-gradient(180deg, var(--surface), transparent);
  border: 1px solid var(--edge); overflow: hidden; }
canvas#chart { position: absolute; inset: 0; width: 100%; height: 100%; }
.facts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.fact { background: var(--surface); border: 1px solid var(--edge); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fact span { font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.fact b { font-family: var(--mono); font-weight: 500; font-size: 1rem; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.best { display: flex; flex-direction: column; gap: 8px; }
.best-head { display: flex; gap: 6px 14px; align-items: baseline; flex-wrap: wrap; }
.best-head b { font-family: var(--display); font-size: .95rem; font-weight: 600; }
.best-head span { font-size: .76rem; color: var(--muted); }
.routes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.route { background: var(--surface); border: 1px solid var(--edge); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.route span { font-size: .66rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.route b { font-family: var(--display); font-weight: 600; font-size: .98rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.route strong { font-family: var(--mono); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.route small { font-family: var(--mono); font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.route.top { border-color: var(--up); box-shadow: 0 0 0 1px var(--up), 0 0 22px color-mix(in srgb, var(--up) 22%, transparent); }
.route.top span, .route.top strong { color: var(--up); }
.route.ref strong { color: var(--muted); }
@media (max-width: 900px) { .routes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.note { font-size: .76rem; color: var(--muted); line-height: 1.5; }
.note b { color: var(--fg); font-weight: 500; }

aside { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
aside h2 { margin: 0 0 2px; font-family: var(--display); font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) 76px auto; align-items: center; gap: 10px; padding: 9px 12px; text-align: left; color: var(--fg);
  background: var(--surface); border: 1px solid var(--edge); border-radius: 10px; transition: border-color .3s, transform .3s; }
.item:hover { border-color: var(--muted); }
.item[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), 0 0 24px color-mix(in srgb, var(--brand) 25%, transparent); }
.item .nm { display: flex; flex-direction: column; min-width: 0; }
.item .nm b { font-family: var(--display); font-weight: 600; font-size: .98rem; }
.item .nm small { font-family: var(--mono); font-size: .72rem; color: var(--muted); }
.item canvas { width: 76px; height: 28px; }
.item .px { display: flex; flex-direction: column; align-items: flex-end; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.item .px b { font-weight: 500; font-size: .9rem; }
.item .px small { font-size: .74rem; }
.up { color: var(--up); } .down { color: var(--down); }

.ticker { overflow: hidden; white-space: nowrap; border-top: 1px solid var(--edge); background: rgba(4, 8, 15, .85);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; }
.tag { flex: none; font-family: var(--display); font-weight: 700; font-size: .85rem; letter-spacing: .14em; background: var(--brand); color: #1a0d00;
  padding: 4px 14px; margin-left: max(20px, env(safe-area-inset-left, 0px)); border-radius: 6px; position: relative; z-index: 2; }
.crawl { overflow: hidden; flex: 1; mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }
.track { display: inline-block; padding-left: 100%; animation: crawl 80s linear infinite; font-family: var(--mono); font-size: 1rem; }
.track span { margin-right: 44px; }
.track b { font-family: var(--display); font-weight: 600; margin-right: 8px; }
@keyframes crawl { to { transform: translateX(-100%); } }
@media (prefers-reduced-motion: reduce) { .track, .aura, .status i { animation: none; } .track { padding-left: 16px; } .price .d { animation: none !important; } }

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .world { margin-left: 0; width: 100%; }
  .range { margin-left: 0; }
}
</style>

</head>
<body>
<div class="aura"></div><div class="grid"></div>

<header class="top gut">
  <div class="logo"><div class="mark">$</div>Câmbio<span>24</span></div>
  <div class="status" id="status"><i></i><span id="statusTxt">CONECTANDO</span></div>
  <div class="world" id="world"></div>
  <div class="tools">
    <button class="tbtn" id="rotate" aria-pressed="false" title="Troca de moeda sozinho a cada 15 segundos">Alternar sozinho</button>
    <button class="tbtn" id="full" title="Tela cheia">Tela cheia</button>
  </div>
</header>

<main class="gut">
  <section class="stage">
    <div class="sym" id="sym">$</div>
    <div class="eyebrow"><span class="pair" id="pair">USD/BRL</span><span class="name" id="name">Dólar americano</span></div>
    <div class="hero">
      <div class="price" id="price"><span class="cur">R$</span>--</div>
      <div class="chg"><div class="pill" id="pill">--</div><small id="since">variação no dia</small></div>
      <div class="range">
        <button class="tbtn" data-range="day" aria-pressed="true">24 horas</button>
        <button class="tbtn" data-range="month" aria-pressed="false">30 dias</button>
      </div>
    </div>
    <div class="chartwrap"><canvas id="chart"></canvas></div>
    <div class="facts">
      <div class="fact"><span>Compra</span><b id="f-bid">--</b></div>
      <div class="fact"><span>Venda</span><b id="f-ask">--</b></div>
      <div class="fact"><span>Abertura</span><b id="f-open">--</b></div>
      <div class="fact"><span>Máxima</span><b id="f-high">--</b></div>
      <div class="fact"><span>Mínima</span><b id="f-low">--</b></div>
    </div>
    <div class="best" id="best" hidden>
      <div class="best-head"><b>Onde trocar reais por bolivianos agora</b><span id="best-route">Buscando cotações nas casas…</span></div>
      <div class="routes" id="routes"></div>
    </div>
    <div class="note" id="note"></div>
  </section>

  <aside>
    <h2>Moedas ao vivo</h2>
    <div class="list" id="list" role="group" aria-label="Escolher moeda"></div>
  </aside>
</main>

<div class="ticker"><div class="tag">CÂMBIO</div><div class="crawl"><div class="track" id="track"></div></div></div>

<script>
(function () {
  const API = "https://economia.awesomeapi.com.br/json";
  const POLL_MS = 30000, DAY_MS = 86400000, STALE_RELOAD_MS = 15 * 60000;
  const PAIRS = [
    { k: "USD-BRL", c: "USDBRL", label: "Dólar americano", short: "Dólar", sym: "$", base: 5.65 },
    { k: "USD-BOB", c: "USDBOBP", label: "Dólar paralelo · Bolívia", short: "Paralelo BOL", sym: "Bs", base: 11.95, quote: "Bs", src: "bo" },
    { k: "EUR-BRL", c: "EURBRL", label: "Euro", short: "Euro", sym: "€", base: 6.24 },
    { k: "BRL-BOB", c: "BRLBOBP", label: "Real → Boliviano · paralelo", short: "Real → Bs", sym: "Bs", base: 2.11, quote: "Bs", src: "brlbob" },
    { k: "BTC-BRL", c: "BTCBRL", label: "Bitcoin", short: "Bitcoin", sym: "₿", base: 404800 },
    { k: "ETH-BRL", c: "ETHBRL", label: "Ethereum", short: "Ethereum", sym: "Ξ", base: 11380 },
    { k: "ARS-BRL", c: "ARSBRL", label: "Peso argentino", short: "Peso ARG", sym: "$", base: 0.00366 },
    { k: "CAD-BRL", c: "CADBRL", label: "Dólar canadense", short: "Dólar CAN", sym: "$", base: 3.96 },
    { k: "AUD-BRL", c: "AUDBRL", label: "Dólar australiano", short: "Dólar AUS", sym: "$", base: 3.84 },
    { k: "JPY-BRL", c: "JPYBRL", label: "Iene japonês", short: "Iene", sym: "¥", base: 0.0353 },
    { k: "CNY-BRL", c: "CNYBRL", label: "Yuan chinês", short: "Yuan", sym: "¥", base: 0.837 },
    { k: "CHF-BRL", c: "CHFBRL", label: "Franco suíço", short: "Franco", sym: "₣", base: 6.75 }
  ];
  const byCode = Object.fromEntries(PAIRS.map(p => [p.c, p]));
  const CITIES = [
    { n: "São Paulo", tz: "America/Sao_Paulo", home: true }, { n: "Nova York", tz: "America/New_York" },
    { n: "Londres", tz: "Europe/London" }, { n: "Tóquio", tz: "Asia/Tokyo" }
  ];

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const $ = id => document.getElementById(id);
  const dec = v => v >= 1000 ? 2 : v >= 0.1 ? 4 : 6;
  const fmt = (v, d) => v.toLocaleString("pt-BR", { minimumFractionDigits: d ?? dec(v), maximumFractionDigits: d ?? dec(v) });
  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  let sel = store.get("cambio:sel"); if (!byCode[sel]) sel = "USDBRL";
  let range = "day", sim = false, simTimer = null, rotateTimer = null;
  let lastOk = Date.now(), failCount = 0, pollTimer = null;
  const quotes = {}, series = {}, monthly = {}, seeded = {};

  // Restaura o histórico salvo: o gráfico volta inteiro depois de desligar a TV ou faltar internet
  PAIRS.forEach(p => {
    const cut = Date.now() - DAY_MS;
    series[p.c] = (store.get("cambio:s:" + p.c) || []).filter(x => x.t >= cut);
    const q = store.get("cambio:q:" + p.c); if (q) quotes[p.c] = q;
  });

  // ---------- rede com tempo limite ----------
  async function getJSON(url) {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 12000);
    try {
      const r = await fetch(url, { cache: "no-store", signal: ctl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } finally { clearTimeout(to); }
  }
  function merge(c, pts) {
    const m = new Map(); series[c].forEach(p => m.set(p.t, p)); pts.forEach(p => m.set(p.t, p));
    const cut = Date.now() - DAY_MS;
    series[c] = [...m.values()].filter(p => p.t >= cut).sort((a, b) => a.t - b.t);
  }
  function persist() {
    if (sim) return;
    PAIRS.forEach(p => { store.set("cambio:s:" + p.c, series[p.c]); if (quotes[p.c]) store.set("cambio:q:" + p.c, quotes[p.c]); });
  }

  async function pollLast() {
    try {
      const j = await getJSON(API + "/last/" + PAIRS.filter(p => !p.src).map(p => p.k).concat("BRL-BOB").join(","));
      if (sim) stopSim();
      if (j.BRLBOB) commercialBOB = +j.BRLBOB.bid;
      for (const c in j) {
        if (!byCode[c]) continue;
        const q = j[c], t = +q.timestamp * 1000;
        quotes[c] = { bid: +q.bid, ask: +q.ask, high: +q.high, low: +q.low, varBid: +q.varBid, pct: +q.pctChange, t };
        merge(c, [{ t, v: +q.bid }]);
      }
      try { await pollBolivia(); } catch (e) {}
      try { await pollRoutes(); } catch (e) {}
      persist(); lastOk = Date.now(); failCount = 0; setStatus("live");
      return true;
    } catch (e) {
      failCount++;
      if (!sim) setStatus("retry");
      return false;
    }
  }
  function schedulePoll() {
    // tenta de novo mais rápido quando falha, sem sobrecarregar o serviço
    const wait = failCount ? Math.min(15000 * 2 ** (failCount - 1), 300000) : POLL_MS;
    clearTimeout(pollTimer);
    pollTimer = setTimeout(async () => { await pollLast(); refreshAll(); schedulePoll(); }, wait);
  }
  // ---------- dólar paralelo da Bolívia: paralelo.bo (mediana de várias P2P), reserva CriptoYa / Binance P2P ----------
  let boHist = null, boHistAt = 0;
  async function boHistory() {
    if (boHist && Date.now() - boHistAt < 3600000) return boHist;
    const j = await getJSON("https://paralelo.bo/api/v1/historical.json");
    boHist = (j.points || []).map(p => ({ t: Date.parse(p.t), v: +p.v })).filter(p => isFinite(p.t) && p.v > 0).sort((a, b) => a.t - b.t);
    boHistAt = Date.now(); return boHist;
  }
  // Real → Boliviano: dólar paralelo (paralelo.bo) dividido pelo dólar comercial em reais
  let crossHist = null, crossAt = 0, commercialBOB = null, routes = null;
  async function crossHistory() {
    if (crossHist && Date.now() - crossAt < 3600000) return crossHist;
    const [bo, usd] = await Promise.all([boHistory(), getJSON(API + "/daily/USD-BRL/30")]);
    const u = usd.map(q => ({ t: +q.timestamp * 1000, v: +q.bid })).filter(q => q.v > 0);
    crossHist = bo.map(p => {
      let best = null; for (const q of u) if (!best || Math.abs(q.t - p.t) < Math.abs(best.t - p.t)) best = q;
      return best && Math.abs(best.t - p.t) < 2 * DAY_MS ? { t: p.t, v: p.v / best.v } : null;
    }).filter(Boolean);
    crossAt = Date.now(); return crossHist;
  }

  // Onde trocar: compra USDT com reais na casa mais barata e vende por bolivianos onde pagam mais (CriptoYa)
  const NAMES = { binancep2p: "Binance P2P", bybitp2p: "Bybit P2P", bitgetp2p: "Bitget P2P", mexcp2p: "MEXC P2P", okexp2p: "OKX P2P",
    kucoinp2p: "KuCoin P2P", bingxp2p: "BingX P2P", vitawallet: "Vita Wallet", saldo: "Saldo", binance: "Binance", bybit: "Bybit",
    foxbit: "Foxbit", ripio: "Ripio", ripioexchange: "Ripio Exchange", belo: "Belo", brasilbitcoin: "Brasil Bitcoin", cryptomktpro: "CryptoMKT", peanut: "Peanut" };

  function loop(ts) { if (ts - lastFrame > 33) { lastFrame = ts; try { draw(); } catch (e) {} } requestAnimationFrame(loop); }

  // ---------- controles ----------
  document.querySelectorAll("[data-range]").forEach(b => b.addEventListener("click", () => {
    range = b.dataset.range; view.lo = view.hi = null;
    document.querySelectorAll("[data-range]").forEach(o => o.setAttribute("aria-pressed", o === b));
    if (range === "month") loadMonth(sel).then(refreshAll);
  }));
  function toggleRotate() {
    if (rotateTimer) { clearInterval(rotateTimer); rotateTimer = null; }
    else rotateTimer = setInterval(() => { const i = PAIRS.findIndex(p => p.c === sel); choose(PAIRS[(i + 1) % PAIRS.length].c, false); }, 15000);
    $("rotate").setAttribute("aria-pressed", !!rotateTimer); store.set("cambio:rotate", !!rotateTimer);
  }
  $("rotate").addEventListener("click", toggleRotate);
  $("full").addEventListener("click", () => {
    try { const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); p && p.catch && p.catch(() => {}); } catch (e) {}
  });
  // controle remoto / teclado: ◀ ▶ trocam a moeda, ▲ ▼ trocam o período, OK liga o "alternar sozinho"
  const APP = /Cambio24App/.test(navigator.userAgent);
  if (APP) $("full").hidden = true;
  document.addEventListener("keydown", e => {
    const n = PAIRS.length, i = PAIRS.findIndex(p => p.c === sel);
    if (e.key === "ArrowRight") { e.preventDefault(); choose(PAIRS[(i + 1) % n].c, true); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); choose(PAIRS[(i + n - 1) % n].c, true); }
    else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();
      document.querySelector(`[data-range="${range === "day" ? "month" : "day"}"]`).click();
    }
    else if (APP && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleRotate(); }
  });

  function clocks() {
    const now = new Date();
    $("world").innerHTML = CITIES.map(c => `<div class="city${c.home ? " home" : ""}"><span>${c.n}</span><b>${now.toLocaleTimeString("pt-BR", { timeZone: c.tz, hour: "2-digit", minute: "2-digit", second: c.home ? "2-digit" : undefined })}</b></div>`).join("");
  }

  // ---------- vigia: se travar ou ficar muito tempo sem dados reais, recarrega sozinho ----------
  setInterval(() => {
    if (!sim && navigator.onLine !== false && Date.now() - lastOk > STALE_RELOAD_MS) location.reload();
  }, 60000);
  window.addEventListener("online", () => { failCount = 0; pollLast().then(refreshAll); });

  // ---------- início ----------
  buildList(); clocks(); setInterval(clocks, 1000);
  requestAnimationFrame(loop);
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
  if (store.get("cambio:rotate")) toggleRotate();
  refreshAll();

  pollLast().then(ok => {
    const hasSaved = PAIRS.some(p => series[p.c].length > 1);
    if (!ok && !hasSaved) startSim();
    choose(sel, false);
    if (!sim) seedAll();
    schedulePoll();
  });
})();
</script>

</body>
